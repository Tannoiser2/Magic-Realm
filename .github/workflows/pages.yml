# Main launcher + two independent Web games under /super and /classico.
# The classic build remains labelled experimental until all original rules are audited.
name: Pubblica

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TARGET"
          FOUND="$(find /root /opt /usr/local /home -type f -name 'web_nothreads_release.zip' -print -quit 2>/dev/null || true)"
          if [ -z "$FOUND" ]; then echo "Godot 4.7.2 Web export templates missing"; exit 1; fi
          SRC="$(dirname "$FOUND")"
          cp "$SRC"/web_nothreads_*.zip "$TARGET"/

      - name: Export Godot Web runtime
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          mkdir -p build/runtime build/site/super build/site/classico
          godot --headless --path . --export-release Web build/runtime/index.html
          test -s build/runtime/index.pck
          test -s build/runtime/index.html

      - name: Assemble protected two-edition site
        shell: bash
        run: |
          set -euo pipefail
          cp -a build/runtime/. build/site/super/
          cp -a build/runtime/. build/site/classico/
          cp web/portal/index.html build/site/index.html
          touch build/site/.nojekyll
          test -s build/site/super/index.pck
          test -s build/site/classico/index.pck
          test -s build/site/index.html

      - name: Upload assembled game for private Cloudflare publishing
        uses: actions/upload-artifact@v4
        with:
          name: magic-realm-published-site
          path: build/site/
          if-no-files-found: error
          retention-days: 7

      - name: Upload public GitHub Pages artifact
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: magic-realm-published-site
          path: build/site
      - name: Publish private Ludoteca site if credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LUDOTECA_DOMINIO: ludoteca-digitale.com
        run: python3 tools/pubblica_cloudflare.py build/site magic-realm magic-realm
