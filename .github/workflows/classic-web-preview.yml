name: Classic Magic Realm — downloadable Web preview

on:
  workflow_dispatch:
  push:
    branches: [feature/magic-realm-classic-3d]
    paths:
      - '.github/workflows/classic-web-preview.yml'

permissions:
  contents: read

jobs:
  export-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout experimental code (not main)
        uses: actions/checkout@v4
      - name: Print engine version
        run: godot --version
      - name: Import Godot resources
        run: godot --headless --editor --path . --import --quit
      - name: Build Web HTML5 artifact
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
      - name: Upload playable preview (not public Pages)
        uses: actions/upload-artifact@v4
        with:
          name: magic-realm-classic-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 30
