name: Classic Magic Realm — downloadable Web preview

on:
  workflow_dispatch:
  push:
    branches: [feature/magic-realm-classic-3d]
    paths:
      - '.github/workflows/classic-web-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/classic-web-preview.yml'

concurrency:
  group: magic-realm-classic-web-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout experimental code (not main)
        uses: actions/checkout@v4
      - name: Print engine version
        run: godot --version
      - name: Import Godot resources
        run: godot --headless --editor --path . --import --quit
      - name: Resolve preinstalled Web export templates
        run: |
          set -eu
          echo "Runner HOME=$HOME"
          TARGET="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TARGET"
          FOUND="$(find /root /opt /usr/local /home -type f -name 'web_nothreads_release.zip' -print -quit 2>/dev/null || true)"
          if [ -z "$FOUND" ]; then
            echo "Could not find preinstalled Web export templates"
            exit 1
          fi
          SRC="$(dirname "$FOUND")"
          echo "Using templates in $SRC"
          cp "$SRC"/web_nothreads_*.zip "$TARGET"/
          ls -lh "$TARGET"/web_nothreads_*.zip
      - name: Build Web HTML5 artifact
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
      - name: Upload playable preview (not public Pages)
        uses: actions/upload-artifact@v4
        with:
          name: magic-realm-classic-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 30
