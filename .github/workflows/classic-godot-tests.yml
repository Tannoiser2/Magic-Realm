name: Classic Magic Realm — Godot tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: magic-realm-classic-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 from SourceForge release mirror
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 6 --connect-timeout 30 \
            'https://sourceforge.net/projects/godot-engine.mirror/files/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip/download' \
            --output /tmp/godot-4.7.2.zip
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godot-dist
          sudo install -m 755 /tmp/godot-dist/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Print Godot version
        run: godot --version
      - name: Import resources and parse scripts
        run: godot --headless --editor --path . --import --quit
      - name: Rule profile checks
        run: timeout 45s godot --headless --path . --script res://tests/profili_regole_test.gd
      - name: All four original 2e Encounters and save round-trip
        run: timeout 45s godot --headless --path . --script res://tests/quattro_encounter_test.gd
      - name: Original horse trading and movement phases
        run: timeout 45s godot --headless --path . --script res://tests/cavalli_classici_test.gd
      - name: Mounted combat and warhorse armor
        run: timeout 45s godot --headless --path . --script res://tests/combattimento_cavalli_test.gd
      - name: Full automatic game each Encounter
        run: timeout 45s godot --headless --path . --script res://tests/partite_quattro_encounter_test.gd
      - name: Original map generation
        run: timeout 45s godot --headless --path . --script res://tests/mappa_classica_test.gd
      - name: Original map chits and lost places
        run: timeout 45s godot --headless --path . --script res://tests/preparazione_classica_test.gd
      - name: Original endgame scoring
        run: timeout 45s godot --headless --path . --script res://tests/punteggio_classico_test.gd
      - name: Complete classic preview
        run: timeout 45s godot --headless --path . --script res://tests/anteprima_classica_test.gd
      - name: Full classic playthroughs
        run: timeout 45s godot --headless --path . --script res://tests/partita_classica_auto_test.gd
      - name: Character re-entry at the Inn
        run: timeout 45s godot --headless --path . --script res://tests/reingresso_classico_test.gd
      - name: Original seventh-day monster return
        run: timeout 45s godot --headless --path . --script res://tests/settimana_classica_test.gd
      - name: Third Encounter FOLLOW activity
        run: timeout 45s godot --headless --path . --script res://tests/seguire_classico_test.gd
      - name: Classic menu and UI smoke test
        timeout-minutes: 4
        run: timeout 45s godot --headless --path . --script res://tests/ui_classico_smoke_test.gd
      - name: UI launches Classic Encounter 1
        env:
          CLASSIC_ENCOUNTER: '1'
        run: timeout 45s godot --headless --path . --script res://tests/ui_incontro_classico_test.gd
      - name: UI launches Classic Encounter 2
        env:
          CLASSIC_ENCOUNTER: '2'
        run: timeout 45s godot --headless --path . --script res://tests/ui_incontro_classico_test.gd
      - name: UI launches Classic Encounter 3
        env:
          CLASSIC_ENCOUNTER: '3'
        run: timeout 45s godot --headless --path . --script res://tests/ui_incontro_classico_test.gd
      - name: UI launches Classic Encounter 4
        env:
          CLASSIC_ENCOUNTER: '4'
        run: timeout 45s godot --headless --path . --script res://tests/ui_incontro_classico_test.gd
      - name: Super free-play UI and separated saves
        timeout-minutes: 4
        run: timeout 45s godot --headless --path . --script res://tests/ui_super_libera_test.gd
      - name: Interactive combat board controls
        timeout-minutes: 4
        run: timeout 45s godot --headless --path . --script res://tests/plancia_combattimento_test.gd
      - name: Legacy save compatibility
        timeout-minutes: 4
        run: timeout 45s godot --headless --path . --script res://tests/profili_salvataggi_test.gd
